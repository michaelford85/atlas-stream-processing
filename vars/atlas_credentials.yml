# MongoDB Atlas API Credentials
# Copy this file to atlas_credentials_local.yml and fill in your actual credentials
# (atlas_credentials_local.yml is gitignored)

atlas_base_url: "https://cloud.mongodb.com"

# Atlas Programmatic API Keys
# Create these at: https://cloud.mongodb.com/v2#/account/publicApi
# Required permissions: Organization Member or Project Owner
atlas_public_key: "YOUR_ATLAS_PUBLIC_KEY"
atlas_private_key: "YOUR_ATLAS_PRIVATE_KEY"
